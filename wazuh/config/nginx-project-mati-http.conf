# Load this file inside the nginx http context (for example, /etc/nginx/conf.d/).
log_format project_mati escape=json
  '{"ts":"$time_iso8601","request":{"remote_ip":"$remote_addr",'
  '"method":"$request_method","uri":"$request_uri","host":"$host",'
  '"proto":"$server_protocol","tls":{"version":"$ssl_protocol"}},'
  '"status":$status,"duration":$request_time,"size":$body_bytes_sent,'
  '"user_id":"$remote_user"}';
