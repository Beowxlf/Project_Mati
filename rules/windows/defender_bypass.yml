title: Microsoft Defender Protection Reduction Command
id: c73a1bd4-b9c7-4b74-a9ee-ec2e2459e2bb
status: test
description: Detects explicit PowerShell commands that disable Defender protection or add broad exclusions.
author: Beowxlf
date: 2026-09-11
references:
  - https://attack.mitre.org/techniques/T1562/001/
logsource:
  product: windows
  service: security
detection:
  process:
    NewProcessName|contains:
      - '\powershell.exe'
      - '\pwsh.exe'
  command:
    ProcessCommandLine|contains:
      - 'Set-MpPreference -DisableRealtimeMonitoring $true'
      - 'Set-MpPreference -DisableBehaviorMonitoring $true'
      - 'Add-MpPreference -ExclusionPath C:\'
      - 'Set-MpPreference -ExclusionPath C:\'
  condition: process and command
falsepositives:
  - Time-bounded troubleshooting under an approved change that is immediately reverted
level: critical
tags:
  - attack.defense_evasion
  - attack.t1562.001
x_detection_id: PM-WIN-DEF-001
x_detection_version: 1.0.0
